name: Production health check

# Watches the live site between deploys and opens a GitHub issue when it
# breaks.
#
# This exists because of how the last set of defects were found: not by anyone
# noticing, but by reading a Search Console export months later. /industries/
# had been answering 403 since the industry pages shipped. Ten sitemap URLs
# were redirects. The SSR bundle was publicly served. Every one of those is a
# single HTTP request to detect, and nothing was making it.
#
# Runs daily and on demand. Read-only against the site.
on:
  schedule:
    # 06:30 UTC = midday IST, so a failure is seen during the working day.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check superprinters.net
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm ci: the smoke test uses only Node built-ins, so this stays fast
      # and cannot be broken by a dependency problem.
      - name: Smoke test production
        id: smoke
        run: |
          set +e
          node scripts/smoke-test.mjs https://superprinters.net 2>&1 | tee smoke.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open an issue if production is unhealthy
        if: steps.smoke.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('smoke.log', 'utf8');

            // Reuse one open issue rather than filing a new one every day.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-health',
            });

            const body = [
              'The daily smoke test against https://superprinters.net failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              log.trim(),
              '```',
              '',
              'Reproduce locally: `node scripts/smoke-test.mjs https://superprinters.net`',
            ].join('\n');

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Production health check failing',
                body,
                labels: ['production-health'],
              });
            }

      - name: Close the issue once production recovers
        if: steps.smoke.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'production-health',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Production health check is passing again as of ${new Date().toISOString()}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      - name: Fail the run when unhealthy
        if: steps.smoke.outputs.exit_code != '0'
        run: exit 1
