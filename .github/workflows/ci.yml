name: CI

# Nothing verified pull requests before this workflow existed — the only
# Actions runs on the repo were Dependabot's. Every check here is one that
# already exists locally in package.json; CI just stops a broken one from
# reaching main unnoticed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, NOT the default --depth 1. scripts/refresh-sitemap.mjs
          # derives each URL's <lastmod> from `git log -1` per source file; a
          # shallow clone reports one identical date for every file, which is
          # exactly the bug that shipped a sitemap where all 117 URLs shared a
          # single date and crawlers learned to ignore the field.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if the two
      # have drifted, which also guards the overrides block.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Builds the client, the SSR bundle, prerenders all routes and
      # regenerates the sitemap. The prerender and sitemap steps carry their
      # own assertions — duplicate canonical/title/description/robots tags,
      # links pointing at a redirect, .htaccess redirects whose target has no
      # page, and published directories with no index.html (which Apache
      # answers 403 for, not 404). Any of those fails the build.
      - name: Build and verify
        run: npm run build

      - name: Check for uncommitted build output
        # refresh-sitemap.mjs rewrites sitemap-lastmod.json when it runs with
        # real git history. If that file is stale in the commit, say so rather
        # than letting the next history-less build silently fall back to
        # today's date for every URL.
        run: |
          if ! git diff --quiet -- sitemap-lastmod.json; then
            echo "::warning::sitemap-lastmod.json is out of date — run 'npm run build' and commit the result."
            git --no-pager diff --stat -- sitemap-lastmod.json
          fi

      - name: Upload deployable build
        # dist/ is what gets uploaded to Hostinger. Publishing it here means a
        # deployable artifact exists for every commit on main without anyone
        # having to build locally. include-hidden-files is required or
        # .htaccess is silently dropped, and without it every redirect, the
        # security headers and the SPA routing rules stop working.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          include-hidden-files: true
          retention-days: 30
